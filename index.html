<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            text-align: center;
            background: white;
            border-radius: 15px;
        }

        button {
            padding: 12px 25px;
            border: 0;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
        }
    </style>
</head>

<body>

<header>
    <h1>My Website</h1>
</header>

<main>
    <h2>Welcome 👋</h2>
    <p>This website was created using Termux on Android.</p>

    <button onclick="alert('Welcome to my website!')">
        Click Me
    </button>
</main>

</body>
</html>
